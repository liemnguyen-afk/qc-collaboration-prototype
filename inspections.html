<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440">
  <title>Quality Inspections — Supplier Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css?v=20260916f">
  <link rel="stylesheet" href="assets/css/styles.css?v=20260916f">
</head>
<body data-role="supplier">

<div class="page">

  <!-- Header — Figma 3782:74664 -->
  <header class="csp-header">
    <div class="csp-header__top">
      <div class="csp-header__brand">
        <span class="csp-header__logo"><img class="icon" src="assets/icons/csp-logo.svg" alt="Coupa"></span>
        <span>supplier portal</span>
      </div>
      <div class="csp-welcome">
        <button class="csp-welcome__item" type="button" data-toast="Account menu is out of scope for this prototype.">
          NILES <img class="csp-welcome__caret" src="assets/icons/caret-down-sm.svg" alt="">
        </button>
        <img class="csp-welcome__divider" src="assets/icons/divider.svg" alt="">
        <button class="csp-welcome__item" type="button" data-toast="No new notifications.">
          NOTIFICATIONS <span class="csp-welcome__count">0</span>
        </button>
        <img class="csp-welcome__divider" src="assets/icons/divider.svg" alt="">
        <button class="csp-welcome__item" type="button" data-toast="Help menu is out of scope for this prototype.">
          HELP <img class="csp-welcome__caret" src="assets/icons/caret-down-sm.svg" alt="">
        </button>
      </div>
    </div>

    <nav class="csp-nav" aria-label="Supplier portal">
      <button class="csp-nav__tab" type="button" data-toast="Home">
        <img class="csp-nav__home" src="assets/icons/csp-home.svg" alt="Home">
      </button>
      <button class="csp-nav__tab" type="button" data-toast="Profile">Profile</button>
      <button class="csp-nav__tab" type="button" data-toast="Tasks">Tasks</button>
      <button class="csp-nav__tab" type="button" data-toast="Items">Items</button>
      <button class="csp-nav__tab" type="button" data-toast="Invoices">Invoices</button>
      <button class="csp-nav__tab" type="button" data-toast="Orders">Orders</button>
      <button class="csp-nav__tab csp-nav__tab--active" type="button" aria-current="page">Quality</button>
      <button class="csp-nav__tab" type="button" data-toast="ASN">ASN</button>
    </nav>

    <!-- Customer selector — Figma 3782:74665 -->
    <div class="csp-customer">
      <label class="csp-customer__label" for="customer">Select Customer</label>
      <select class="csp-customer__select" id="customer">
        <option>Frasier Inc</option>
        <option>Buyer Enterprises</option>
        <option>Acme Manufacturing</option>
      </select>
    </div>
  </header>

  <div class="page-title">
    <h1>Quality Inspections</h1>
  </div>

  <main class="content">

    <!-- Quality Inspections list — Figma 514:38555 -->
    <section class="table-block">
      <div class="table-block__title-row">
        <button class="views-trigger" type="button" data-views-trigger aria-haspopup="true">
          <img src="assets/icons/menu-hamburger.svg" alt="">
          Views
        </button>
        <h2 class="table-block__title" data-view-name>All Quality Inspections</h2>
      </div>

      <div class="views-panel" data-views-panel>
        <p class="views-panel__title">SAVED VIEWS</p>
        <button class="views-panel__item is-active" type="button">All Quality Inspections</button>
        <button class="views-panel__item" type="button">Awaiting My Results</button>
        <button class="views-panel__item" type="button">In Buyer Review</button>
        <button class="views-panel__item" type="button">Closed</button>
      </div>

      <div class="table-block__toolbar">
        <span class="table-search">
          <img src="assets/icons/search-in-view.svg" alt="">
          <input type="search" placeholder="Search in this view" aria-label="Search in this view" data-ins-search>
        </span>
        <button class="icon-button" type="button" data-toast="Filter panel is out of scope for this prototype.">
          <img src="assets/icons/filter.svg" alt="Filter">
        </button>
        <button class="icon-button" type="button" data-toast="More table actions: export, manage columns.">
          <img src="assets/icons/more-v.svg" alt="More actions">
        </button>
      </div>

      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th data-ins-sort-key="id">Inspection ID</th>
              <th data-ins-sort-key="itemName">Item Name</th>
              <th data-ins-sort-key="documentReference">Document Reference</th>
              <th data-ins-sort-key="requestDate">Request Date</th>
              <th data-ins-sort-key="dueDate">Due Date</th>
              <th data-ins-sort-key="characteristics">Characteristics</th>
              <th data-ins-sort-key="status">Status</th>
              <th class="col-actions">Actions</th>
            </tr>
          </thead>
          <tbody data-inspections-body></tbody>
        </table>
      </div>

      <div class="table-block__footer">
        <div class="page-size" data-page-size>
          <span>Items per page:</span>
          <button type="button" class="is-current">15</button>
          <button type="button">45</button>
          <button type="button">90</button>
          <span data-ins-count></span>
        </div>
        <div class="pager" data-pager>
          <button type="button">Prev</button>
          <button type="button" class="is-current">1</button>
          <button type="button">2</button>
          <button type="button">3</button>
          <span>...</span>
          <button type="button">9</button>
          <button type="button">Next</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer — Figma 3782:74699 -->
  <footer class="footer">
    <div class="footer__border"></div>
    <div class="footer__contents">
      <img class="footer__logo" src="assets/icons/footer-logo.svg" alt="Coupa">
      <p class="footer__links">
        <span>Business Spend Management</span>
        <span>•</span>
        <img src="assets/icons/flag-en.png" alt=""> <span>English</span>
        <span>•</span>
        <span>Accessibility</span>
        <span>•</span>
        <span>Coupa Cares</span>
      </p>
    </div>
  </footer>
</div>

<div class="proto-switch">
  <span class="proto-switch__label">View as</span>
  <a class="is-current" href="index.html">Supplier</a>
  <a href="buyer.html">Buyer</a>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/data.js?v=20260916f"></script>
<script src="assets/js/app.js?v=20260916f"></script>
</body>
</html>
